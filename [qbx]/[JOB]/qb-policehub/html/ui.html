<html>

<head>
    <link rel="stylesheet" type="text/css" href="css/main.css" />
    <link rel="stylesheet" href="https://code.jquery.com/ui/1.12.1/themes/base/jquery-ui.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/4.0.0/animate.min.css" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css"
        integrity="sha512-z3gLpd7yknf1YoNbCzqRKc4qyor8gaKU1qmn+CShxbuBusANI9QpRohGBreCFkKxLhei6S9CQXFEbbKuqLg0DA=="
        crossorigin="anonymous" referrerpolicy="no-referrer" />
    <link
        href="https://fonts.googleapis.com/css2?family=DotGothic16&family=Ovo&family=Press+Start+2P&family=Source+Sans+Pro&family=VT323&display=swap"
        rel="stylesheet">
    <script src="https://code.jquery.com/jquery-1.12.4.js"></script>
    <script src="https://code.jquery.com/ui/1.12.1/jquery-ui.js"></script>
    <link rel="stylesheet" href="https://site-assets.fontawesome.com/releases/v6.4.2/css/all.css">
    <link rel="stylesheet" href="https://site-assets.fontawesome.com/releases/v6.4.2/css/sharp-solid.css">
    <link rel="stylesheet" href="https://site-assets.fontawesome.com/releases/v6.4.2/css/sharp-regular.css">
    <link rel="stylesheet" href="https://site-assets.fontawesome.com/releases/v6.4.2/css/sharp-light.css">

</head>

<body>
    <!-- jabercode -->
    <audio id="notifysound" src="audios/notify.mp3"></audio>
    <audio id="new1" src="audios/notifydouble.mp3"></audio>
    <div class="container">
        <div class="header">
            <h>Active Employees</h>
        </div>
        <div class="header1">
            <h>LSPD</h>
        </div>
        <div class="codextra"></div>
        <div class="all-contents">
            <div class="content" id="police-container">
                
            </div>
            <!--- PLIST --->

            <div class="content" id="settings-container">
                <div class="header">Police List</div>
                <div class="setting">
                    <div class="section">
                        <div class="section-title"><i class="fa-sharp fa-solid fa-sliders"></i>Change Callsign</div>
                        <div class="section-buttons">

                        </div>
                    </div>
                </div>
            </div>
        </div>
                                    
        <div class="callsign-button">
            <input class="callsign-input" type="text" placeholder="Enter your Callsign">
            <div class="callsign-confirm">Submit</div>
        </div>
        <div class="line"></div>
        <div class="options">
            <div class="options1">
                <div class="button0-disabled" id="police-count">5</div>
                <div class="button" id="police-list" data-show="police-container">
                    <i class="fa-duotone fa-people-group"></i>
                </div>
                <div class="button" id="duty" >
                    <i class="fa-regular fa-clipboard"></i>
                </div>
                <div class="button" id="callsign" >
                    <i class="fa-regular fa-pen-to-square"></i>
                </div>

                <div class="button" id="move">
                    <i class="fa-solid fa-minus"></i>
                </div>

                <div class="button" id="resize" >
                    <i class="fa-solid fa-up-down-left-right"></i>
                </div>
                
                <div id="dutyText" style="display: none;">Duty</div>
                <div id="listtext" style="display: none;">Officers</div>
                <div id="MoveText" style="display: none;">Move</div>
                <div id="CallsignText" style="display: none;">Callsign</div>
                <div id="resizetext" style="display: none;">Resize</div>
           
                <div class="button1">
                    <i class="fa-solid fa-bars"></i>
                </div>
            </div>
        </div>
    </div>
    <div id="dutyText" style="display: none;">Duty</div>
    <script src="js/vue.min.js"></script>
    <script src="js/app.js" type="text/javascript"></script>
</body>

</html>
